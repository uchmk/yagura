[package]
name = "yagura-core"
version = "0.73.86"
edition = "2024"
rust-version = "1.95"
description = "yagura's collectors: what the machine is doing, without any UI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uchmk/yagura"

[dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["disk", "network", "system", "user"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ito-common = { git = "https://github.com/uchmk/ito", rev = "2e3e12b2717fe2110ebced15c2677450b7df6b0d" }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
nvml-wrapper = { version = "0.13", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
plist = { version = "1.8", default-features = false }
sysinfo = { version = "0.39", default-features = false, features = ["component"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFData", "CFDictionary", "CFNumber", "CFPlugInCOM", "CFString", "CFUUID"] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "libc"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
ito-i18n = { git = "https://github.com/uchmk/ito", rev = "2e3e12b2717fe2110ebced15c2677450b7df6b0d" }
plist = { version = "1.8", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }
