name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE-*']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE-*']
  # merge-lanes.py starts it after pushing its share to main, since a push
  # with the workflow's token starts no workflows.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    # Windows is the target platform; Linux reads sysfs. macOS only builds and
    # tests on main, a limit set when its minutes were billed at ten times
    # Linux's. That is a private repository's rate: standard runners bill a
    # public one nothing (GitHub's billing docs, checked 2026-10-16).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        exclude:
          - os: ${{ github.ref != 'refs/heads/main' && 'macos-latest' || 'none' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked
      - run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt clippy
      - run: rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --target aarch64-apple-darwin -- -D warnings

  # The tests on Windows and Linux ARM64 (arm64.yml), on a push to main only.
  arm64:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/arm64.yml

  powershell:
    # The Windows test lane's scripts parse, and its chunk picker picks right.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pwsh -NoProfile -File scripts/check-ps1.ps1

  # Start it on a virtual display, visit every screen and check each drew
  # (scripts/smoke-linux.sh). A runner has no GPU, so Mesa's llvmpipe draws
  # the OpenGL: slow, and correct, which is all this asks.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install a display and a software GL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick \
            libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6
      - run: cargo build --locked
      - name: Start it and photograph every screen
        run: scripts/smoke-linux.sh target/smoke
      # Kept whether or not the step passed: a failure is a picture of
      # something, and the picture is the report.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-smoke
          path: target/smoke
          if-no-files-found: warn
