[package]
name = "yagura"
version = "0.73.12"
edition = "2024"
rust-version = "1.95"
description = "A keyboard-driven system monitor: cores and threads at a glance"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uchmk/yagura"
# `yagura-com` (src/bin/yagura-com.rs) makes two binaries, and a bare
# `cargo run` would not know which one to start.
default-run = "yagura"

[dependencies]
eframe = "0.36"
egui = "0.36"
sysinfo = { version = "0.39", default-features = false, features = ["disk", "network", "system", "user"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
# `--snapshot`: the readings as JSON (pure Rust).
serde_json = "1"
# The fleet agent's frames: length + postcard, shared with tsumugi.
ito-ipc = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# The split tree behind the resizable panels, shared with tsumugi and kura.
# Every shared crate is kept in uchmk/ito (since v0.32.1) and pinned to
# one commit, the same for all of them; to take a fix, move `rev` and run
# `cargo build` so Cargo.lock follows. It depends on nothing but egui.
ito-layout = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa", features = ["egui", "serde"] }
# The translation table and the language setting in common.toml, shared with tsumugi.
ito-i18n = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# yazi's key notation and egui's key events in the same terms, shared with tsumugi.
ito-keys = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa", features = ["egui"] }
ito-keymap = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
ito-help = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# common.toml (theme, clock, language), editing a TOML file in place and
# watching it; the themes; the settings screen's frame and widgets. All
# shared with tsumugi and kura (ito's docs/common-spec.md).
ito-common = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa", features = ["clock", "egui"] }
ito-notify = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# `--keys` scripts, the wgpu backend choice and the command palette.
ito-keyscript = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
ito-gpu = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
ito-palette = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# The window's own title bar and the notice list under its bell.
ito-titlebar = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
ito-notices = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
ito-theme = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
ito-prefs = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# `yagura.com` (src/bin/yagura-com.rs) and the answers `out` and `err` write
# (v0.66.0), shared with every uchmk app.
ito-console = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# The pre-filled bug report F12 opens (shared with every uchmk app).
ito-bugreport = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# The clock's local time (pure Rust).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The fleet's direct connections: the Noise handshake and ciphers (pure
# Rust; "std" is left off, it would bring ring and its C), and the keys
# written as base64 in config.toml.
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }

# NVIDIA's management library, loaded at run time: without the driver it is
# simply not there and no NVIDIA device is listed from it. macOS has no NVML.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
nvml-wrapper = { version = "0.13", default-features = false }

# launchd's plists, XML or binary: pure Rust. The tests read plists on every
# OS, so it is a dev-dependency too. sysinfo's components are the SMC and HID
# temperatures; Linux and Windows read their sensors themselves. The drives
# are read from IOKit through the bindings sysinfo already uses, and a
# volume's device from `statfs`.
[target.'cfg(target_os = "macos")'.dependencies]
plist = { version = "1.8", default-features = false }
sysinfo = { version = "0.39", default-features = false, features = ["component"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFData", "CFDictionary", "CFNumber", "CFPlugInCOM", "CFString", "CFUUID"] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "libc"] }
libc = "0.2"

# setpriority and sched_setaffinity for the priority and affinity keys, on
# every thread of the process.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# build.rs writes the icon into yagura.exe's resources as PNG.
[build-dependencies]
ito-winres = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }

[dev-dependencies]
# The checklists' generator behind examples/make-testcheck.rs.
ito-testcheck = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
plist = { version = "1.8", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
